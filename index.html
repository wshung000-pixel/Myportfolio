<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="資產追蹤">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light dark">
<title>資產追蹤</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  color-scheme: light;
  --bg: #ffffff;
  --bg-solid:#ffffff;
  --bg2:#ffffff;
  --bg3:#f2f2f7;
  --card:#ffffff;
  --card-border:#e5e5ea;
  --border:rgba(60,60,67,0.13);
  --glass-shadow:0 1px 0 rgba(0,0,0,0.04);
  --glass-blur:blur(24px) saturate(1.8);
  --accent:#007aff;
  --accent2:#34c759;
  --green:#19a553;
  --red:#ff3b30;
  --text:#1c1c1e;
  --text2:#48484a;
  --text3:#8e8e93;
  --safe-top: env(safe-area-inset-top);
  --safe-bot: env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;color:var(--text);font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,sans-serif;overscroll-behavior:none}
html{background:var(--bg-solid)}
body{background:var(--bg);display:flex;flex-direction:column;width:100%;max-width:none;margin:0;position:relative;min-height:100%}

/* Header */
.header{padding:calc(var(--safe-top) + 16px) 20px 16px;background:var(--bg-solid);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur)}
.header-inner{display:flex;align-items:center;justify-content:space-between}
.app-title{font-size:24px;font-weight:800;font-style:italic;letter-spacing:-0.5px;color:var(--text)}
.total-badge{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--text)}

/* Tab bar */
.tab-bar{position:fixed;bottom:8px;left:14px;right:14px;background:rgba(255,255,255,0.92);border-radius:26px;padding:6px 4px;display:flex;z-index:100;backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--border);box-shadow:0 6px 24px rgba(0,0,0,0.12)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;background:none;border:none;cursor:pointer;color:var(--text3);font-size:10px;font-weight:600;font-family:inherit;transition:all .2s;line-height:1;border-radius:18px}
.tab.active{color:var(--text);background:none}
.tab svg{width:22px;height:22px;display:block}

/* Content */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.section{display:block}

.glass-row{background:transparent;border-radius:0;box-shadow:none;border-bottom:1px solid var(--border);margin-bottom:0;padding:14px 4px}

/* Metric cards */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.metric{background:var(--bg2);border-radius:14px;padding:16px;border:1px solid var(--border);box-shadow:none}
.metric.full{grid-column:1/-1}
.metric-label{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.metric-value{font-size:24px;font-weight:700;letter-spacing:-0.5px}
.metric-sub{font-size:13px;margin-top:3px}
.up{color:var(--green)}.down{color:var(--red)}.muted{color:var(--text2)}

/* Cards */
.card{background:transparent;border-radius:0;border:none;padding:4px 0;margin-bottom:16px;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
.card-title{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px}

/* Form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
.form-label{font-size:12px;font-weight:600;color:var(--text3);letter-spacing:.05em;text-transform:uppercase}
.form-input,.form-select{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-size:16px;font-family:inherit;width:100%;outline:none;-webkit-appearance:none}
.form-input::placeholder{color:var(--text3)}
.form-input:focus,.form-select:focus{border-color:var(--accent);background:var(--bg2)}
.form-select option{background:var(--bg2);color:var(--text)}
.add-btn{width:100%;padding:12px;background:var(--accent);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.02em;transition:opacity .2s}
.add-btn:active{opacity:.8}

/* Stock rows */
.stock-row{display:flex;align-items:center;padding:10px 0}
.stock-row:last-child{border-bottom:none}
.stock-left{flex:1}
.stock-sym{font-size:17px;font-weight:700;letter-spacing:.01em}
.stock-meta{font-size:13px;color:var(--text2);margin-top:2px}
.stock-right{text-align:right}
.stock-mv{font-size:16px;font-weight:600}
.stock-pnl{font-size:13px;margin-top:2px}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;margin-right:5px;letter-spacing:.05em}
.badge-tw{background:#f7d4da;color:#cc3a52}
.badge-us{background:#d6e6ff;color:#2f6fed}
.badge-bank{background:rgba(180,140,40,.15);color:#9a7820}
.del-btn{background:none;border:none;color:var(--text3);font-size:18px;padding:4px 8px;cursor:pointer;margin-left:8px}
.del-btn:active{color:var(--red)}

/* Empty state */
.empty{text-align:center;padding:32px 16px;color:var(--text3);font-size:13px}

/* Refresh bar */
.refresh-bar{display:flex;align-items:center;gap:10px;padding-top:12px;border-top:1px solid var(--border);margin-top:4px}
.refresh-btn{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:8px 14px;color:var(--text);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.refresh-btn:active{opacity:.7}
.refresh-status{font-size:12px;color:var(--text3)}

/* Donut chart */
.donut-wrap{display:flex;align-items:center;gap:20px;padding:8px 0}
.donut-svg{flex-shrink:0}
.donut-legend{flex:1;display:flex;flex-direction:column;gap:10px}
.legend-item{display:flex;align-items:center;gap:8px}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.legend-name{font-size:13px;color:var(--text2);flex:1}
.legend-pct{font-size:14px;font-weight:700}

/* PnL bars */
.pnl-bar-wrap{display:flex;flex-direction:column;gap:10px;padding:4px 0}
.pnl-item{display:flex;align-items:center;gap:10px}
.pnl-sym{font-size:13px;font-weight:700;width:52px;flex-shrink:0;text-align:right}
.pnl-track{flex:1;background:rgba(0,0,0,0.07);border-radius:4px;height:8px;overflow:hidden}
.pnl-fill{height:100%;border-radius:4px;transition:width .6s ease}
.pnl-val{font-size:12px;width:80px;text-align:right;flex-shrink:0}

/* Spinner */
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle}

/* Status msg */
.status-msg{font-size:13px;color:var(--text2);padding:6px 0;min-height:20px}

/* Backup toast */
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 90px);left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.55);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);border:1px solid rgba(255,255,255,0.85);border-radius:22px;padding:12px 20px;font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:10px;z-index:999;white-space:nowrap;animation:slideUp .3s ease;box-shadow:0 8px 32px rgba(0,0,0,0.12),inset 0 1px 0 rgba(255,255,255,0.95)}
.toast.hide{animation:fadeOut .4s ease forwards}
.toast-icon{font-size:16px;width:16px;height:16px}

/* PnL sort chips */
.sf-btn{padding:4px 10px;font-size:12px;font-weight:600;border:1px solid var(--border);border-radius:20px;background:transparent;color:var(--text2);cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
.sf-active{background:var(--text);color:var(--bg-solid);border-color:var(--text)}
.pnl-sort-btn{padding:5px 10px;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,0.5);border-radius:20px;background:rgba(255,255,255,0.25);color:var(--text2);cursor:pointer;font-family:inherit;transition:all .15s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pnl-sort-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* Trend controls */
.trend-controls{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
/* Segmented control (time) */
.seg-ctrl{display:flex;background:var(--bg3);border-radius:9px;padding:2px;flex-shrink:0}
.seg-btn{padding:5px 11px;font-size:13px;font-weight:600;border:none;border-radius:7px;background:transparent;color:var(--text2);cursor:pointer;font-family:inherit;transition:all .18s;white-space:nowrap}
.seg-btn.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* Data chips */
.data-chips{display:flex;gap:5px}
.data-chip{display:flex;align-items:center;gap:4px;padding:5px 9px;font-size:12px;font-weight:600;border:1.5px solid var(--border);border-radius:20px;background:transparent;color:var(--text2);cursor:pointer;font-family:inherit;transition:all .18s;white-space:nowrap}
.data-chip.active{background:var(--bg);border-color:var(--border);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.10)}
.chip-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* Period table */
.period-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:12px}
.period-tbl{width:100%;border-collapse:collapse;font-size:13px}
.period-tbl th{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:4px 8px;text-align:right;border-bottom:1px solid var(--border)}
.period-tbl th:first-child{text-align:left}
.period-tbl td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--border);color:var(--text2)}
.period-tbl td:first-child{text-align:left;font-weight:700;color:var(--text)}
.period-tbl tr:last-child td{border-bottom:none}

/* Backup section */
.backup-row{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.backup-btn{flex:1;padding:10px 0;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center}
.backup-btn:active{opacity:.7}
.backup-btn.import{color:var(--accent2);border-color:rgba(78,205,196,.3)}

/* Dark mode */
body.dark{
  color-scheme: dark;
  --bg: #000000;
  --bg-solid:#000000;
  --bg2:#1c1c1e;
  --bg3:#2c2c2e;
  --card:#000000;
  --card-border:#2c2c2e;
  --glass-shadow:0 1px 0 rgba(255,255,255,0.04);
  --border:rgba(255,255,255,0.11);
  --accent:#0a84ff;
  --accent2:#30d158;
  --green:#30d158;
  --red:#ff453a;
  --text:#ffffff;--text2:#aeaeb2;--text3:#8e8e93;
}
html.dark{background:#000000}
body.dark .app-title{color:var(--text)}
body.dark .header{background:#000000;border-bottom:1px solid var(--border)}
body.dark .total-badge{background:var(--bg3);border-color:var(--border);color:var(--text)}
body.dark .tab-bar{background:rgba(28,28,30,0.92);border-color:rgba(255,255,255,0.10);box-shadow:0 8px 32px rgba(0,0,0,0.6)}
body.dark .tab.active{background:none;color:var(--text)}
body.dark .form-input,body.dark .form-select{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.13);color:#f0f0f0}
body.dark .form-input:focus,body.dark .form-select:focus{background:rgba(255,255,255,0.12)}
body.dark .form-select option{background:#2c2c2c}
body.dark .toast{background:rgba(35,35,35,0.88);border-color:rgba(255,255,255,0.13);color:#f0f0f0;box-shadow:0 8px 32px rgba(0,0,0,0.45),inset 0 1px 0 rgba(255,255,255,0.08)}
body.dark .backup-btn{background:rgba(255,255,255,0.07);border-color:rgba(255,255,255,0.11)}
body.dark .seg-btn.active{background:rgba(255,255,255,0.13);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.35)}
body.dark .data-chip.active{background:rgba(255,255,255,0.11);box-shadow:0 1px 4px rgba(0,0,0,.35)}
body.dark .glass-row{background:transparent;box-shadow:none}
body.dark .legend-name{color:var(--text)}
body.dark .legend-pct{filter:brightness(1.25)}
body.dark .metric{background:var(--bg2);box-shadow:none}
body.dark .sf-btn,body.dark .pnl-sort-btn{background:transparent;border-color:var(--border);color:var(--text3)}
.add-stock-modal-bg{background:var(--bg2)}
body.dark .add-stock-modal-bg{background:#1c1c1e}
body.dark #add-stock-modal{background:#1e1e1e}

@keyframes iconPop{from{opacity:0;transform:scale(.6) rotate(-45deg)}to{opacity:1;transform:scale(1) rotate(0deg)}}
#dark-btn svg{animation:iconPop .22s cubic-bezier(.34,1.56,.64,1)}
#dark-btn{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;transition:background .15s}

/* ── IG-style 動態 feed ── */
#sec-feed{padding:8px 0 calc(env(safe-area-inset-bottom) + 80px)!important}
.ig-stories{display:flex;gap:14px;overflow-x:auto;padding:8px 16px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ig-stories::-webkit-scrollbar{display:none}
.ig-story{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;width:72px;background:none;border:none;font-family:inherit;padding:0}
.ig-story .ring{width:64px;height:64px;border-radius:50%;padding:2.5px;display:flex;align-items:center;justify-content:center}
.ig-story .ring-inner{width:100%;height:100%;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;border:2.5px solid var(--bg-solid)}
body.dark .ig-story .ring-inner{border-color:#1c1c1e}
.ig-story .ic{font-size:14px;font-weight:800;letter-spacing:-0.5px;color:#fff;line-height:1}
.ig-story .lbl{font-size:11px;color:var(--text2);font-weight:600;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ig-story:active .ring{transform:scale(.93);transition:transform .1s}

.ig-divider{display:flex;align-items:center;justify-content:space-between;padding:4px 18px 10px;border-bottom:1px solid var(--border);margin-bottom:4px}
.ig-divider .t{font-size:13px;font-weight:800;color:var(--text)}
.ig-divider .r{font-size:11px;color:var(--text3);font-weight:500}

.ig-post{margin:0 0 10px;background:var(--card);border:1px solid var(--card-border);border-radius:0}
.ig-post:first-of-type{}
.ig-post-head{display:flex;align-items:center;gap:10px;padding:10px 14px}
.ig-post-av{width:42px;height:42px;border-radius:50%;flex-shrink:0;padding:2px;display:flex;align-items:center;justify-content:center}
.ig-post-av .inner{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg2);border:2px solid var(--bg-solid)}
body.dark .ig-post-av .inner{border-color:#1c1c1e}
.ig-post-av .inner .ic{font-size:13px;font-weight:800;color:#fff;letter-spacing:-0.5px;line-height:1}
.ig-post-meta{flex:1;min-width:0}
.ig-post-meta .name{font-size:14px;font-weight:700;color:var(--text);line-height:1.25}
.ig-post-meta .sub{font-size:11px;color:var(--text3);line-height:1.3;margin-top:1px}
.ig-post-more{background:none;border:none;color:var(--text2);font-size:18px;line-height:1;cursor:pointer;padding:4px;letter-spacing:1px}
.ig-snap-body{text-align:center;padding:22px 16px 24px}
.ig-snap-total{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1}
.ig-snap-chg{font-size:15px;font-weight:700;margin-top:8px}
.ig-snap-split{display:flex;margin-top:18px}
.ig-snap-split>div{flex:1}
.ig-snap-split .k{font-size:12px;color:var(--text3);font-weight:600;margin-bottom:3px}
.ig-snap-split .v{font-size:16px;font-weight:700;color:var(--text2);letter-spacing:-0.3px}
.ig-txn-body{text-align:center;padding:22px 16px;background:var(--bg3)}
.ig-txn-body .k{font-size:12px;color:var(--text3);font-weight:600;letter-spacing:.05em}
.ig-txn-body .big{font-size:30px;font-weight:800;color:var(--text);letter-spacing:-1px;margin:6px 0 4px;line-height:1}
.ig-txn-body .sub{font-size:13px;color:var(--text3);font-weight:500}
.ig-actions{display:flex;align-items:center;gap:16px;padding:10px 14px 12px}
.ig-actions svg{width:24px;height:24px;stroke:var(--text);fill:none;stroke-width:1.9}
.ig-actions .heart-n{font-size:13px;font-weight:700;color:var(--text);margin-left:-8px}
.ig-actions .sp{flex:1}
.ig-actions .like-on svg{fill:var(--red);stroke:var(--red)}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="app-title">資產追蹤</div>
    <div style="display:flex;align-items:center;gap:8px">
      <button onclick="refreshAll()" id="header-refresh-btn" style="background:none;border:none;cursor:pointer;padding:4px;color:var(--text2);font-size:18px;line-height:1">↻</button>
      <button onclick="exportBackup()" title="匯出備份" style="background:none;border:none;cursor:pointer;padding:4px;color:var(--text2);line-height:1;display:flex;align-items:center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <label title="匯入備份" style="cursor:pointer;padding:4px;color:var(--text2);line-height:1;display:flex;align-items:center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <input type="file" accept=".json" onchange="importBackup(event)" style="display:none">
      </label>
      <button onclick="toggleDark()" id="dark-btn" style="background:none;border:none;cursor:pointer;padding:0;color:var(--text2)" aria-label="切換深淺色">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M15.5 12.3A7.5 7.5 0 0 1 5.7 2.5a7.5 7.5 0 1 0 9.8 9.8z" fill="currentColor"/></svg>
      </button>
      <div class="total-badge" id="header-total">NT$ 0</div>
    </div>
  </div>
  <div id="header-refresh-status" style="font-size:10px;color:var(--text3);text-align:right;margin-top:2px;min-height:12px"></div>
</div>


<div class="content" id="swipe-container" style="overflow-y:auto;overflow-x:hidden;padding:0">
<div id="swipe-wrapper" style="display:flex;transition:transform .3s cubic-bezier(.4,0,.2,1);will-change:transform;height:100%;align-items:flex-start">

<!-- 總覽 -->
<div id="sec-overview" class="section active" style="min-width:100%;padding:16px 16px calc(env(safe-area-inset-bottom) + 80px);overflow-y:auto;height:100%">

  <!-- 大數字主卡 -->
  <div class="card" style="text-align:center;padding:20px 16px">
    <div style="font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px">總現值</div>
    <div style="font-size:36px;font-weight:700;letter-spacing:-1px;color:var(--text);line-height:1" id="ov-total-big">NT$ 0</div>
    <div id="ov-yesterday" style="font-size:13px;font-weight:600;margin-top:8px;min-height:18px"></div>
    <div id="rate-badge" style="font-size:11px;color:var(--text3);margin-top:6px">1 USD = 32.00 TWD（預設值）</div>

/* ── Toast ── */
let toastTimer=null;
function showToast(msg,icon='✅'){
  let t=document.getElementById('toast');
  if(t)t.remove();
  clearTimeout(toastTimer);
  t=document.createElement('div');
  t.id='toast';t.className='toast';
  t.innerHTML=`<span class="toast-icon">${icon}</span><span>${msg}</span>`;
  document.body.appendChild(t);
  toastTimer=setTimeout(()=>{t.classList.add('hide');setTimeout(()=>t.remove(),400);},2800);
}

/* ── Auto backup on page leave ── */
function autoBackup(){
  // 靜默儲存，不做任何動作
}

/* ── Manual export ── */
function exportBackup(){
  const data={stocks,banks,realized,snapshots,priceHistory,savedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const date=new Date().toLocaleDateString('zh-TW').replace(/\//g,'-');
  a.href=url;a.download=`資產備份_${date}.json`;
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
  showToast('備份匯出完成','💾');
}

/* ── Import ── */
function importBackup(event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data.stocks||!data.banks)throw new Error('格式錯誤');
      const savedAtStr = data.savedAt ? new Date(data.savedAt).toLocaleString('zh-TW') : '未知';
      openConfirmModal('匯入備份',
        `備份時間：${savedAtStr}\n目前所有資料將被覆蓋。`, ()=>{
        stocks=data.stocks; banks=data.banks;
        if(data.realized) realized=data.realized;
        if(data.snapshots) snapshots=data.snapshots;
        if(data.priceHistory) priceHistory=data.priceHistory;
        localStorage.setItem('pt_stocks',JSON.stringify(stocks));
        localStorage.setItem('pt_banks',JSON.stringify(banks));
        localStorage.setItem('pt_realized',JSON.stringify(realized));
        localStorage.setItem('pt_snapshots',JSON.stringify(snapshots));
        localStorage.setItem('pt_price_history',JSON.stringify(priceHistory));
        renderStockList();renderBankList();renderOverview();
        showToast('備份匯入成功','✅');
      }, '確認匯入', false);
    }catch(err){showToast('匯入失敗：格式不正確','❌');}
    event.target.value='';
  };
  reader.readAsText(file);
}
function fmt(n){return Number(n).toLocaleString('zh-TW',{maximumFractionDigits:6});}
function fmtInt(n){return Math.round(Number(n)).toLocaleString('zh-TW');}
function fmtD(n,d=2){return Number(n).toLocaleString('zh-TW',{maximumFractionDigits:d,minimumFractionDigits:d});}

    tooltipBorder: dark?'#48484a':'#d1d1d6',

  };
}
function fmtY(v){ return Math.abs(v)>=10000 ? Math.round(v/10000)+'萬' : fmtInt(v); }

/* ── Nice Y-axis step ── */
function niceYStep(range){
  const rough = range / 4;
  if(rough <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const norm = rough / mag;
  const nice = norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10;
  return nice * mag;
}

/* ── Swipe gestures ── */
(function(){
  const el = document.getElementById('swipe-container');
  let startX=0, startY=0, diffX=0, isDragging=false, isHorizontal=null;

  el.addEventListener('touchstart', e=>{
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    diffX = 0; isDragging=true; isHorizontal=null;
    document.getElementById('swipe-wrapper').style.transition='none';
  }, {passive:true});

  el.addEventListener('touchmove', e=>{
    if(!isDragging) return;
    diffX = e.touches[0].clientX - startX;
    const diffY = e.touches[0].clientY - startY;
    if(isHorizontal===null) isHorizontal = Math.abs(diffX) > Math.abs(diffY);
    if(!isHorizontal) return;
    e.preventDefault(); // 阻止 Safari 的「上一頁」手勢
    const base = currentTab * 100;
    document.getElementById('swipe-wrapper').style.transform = `translateX(calc(-${base}% + ${diffX}px))`;
  }, {passive:false});

  el.addEventListener('touchend', e=>{
    isDragging=false;
    document.getElementById('swipe-wrapper').style.transition='transform .3s cubic-bezier(.4,0,.2,1)';
    if(!isHorizontal){ goToTab(currentTab); return; }
    if(diffX < -50 && currentTab < TABS.length-1) goToTab(currentTab+1);
    else if(diffX > 50 && currentTab > 0) goToTab(currentTab-1);
    else goToTab(currentTab);
  }, {passive:true});
})();

async function fetchPrice(sym, mkt){
  try{
    if(mkt==='TW'){
      // 台股：嘗試多個 Fugle key 格式
      try{
        const r = await fetch(`https://api.fugle.tw/marketdata/v1.0/stock/intraday/quote/${sym}`, {
          headers: {'X-API-KEY': FUGLE_KEY},
          signal: AbortSignal.timeout(8000)
        });
        const d = await r.json();
        const price = d?.lastPrice ?? d?.closePrice ?? d?.previousClose;
        if(price && price > 0) return {price, currency:'TWD'};
      }catch(e){}
      // 備援：TWSE via proxy
      try{
        const twseUrl = 'https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL';
        const r2 = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(twseUrl)}`, {signal: AbortSignal.timeout(10000)});
        const list = await r2.json();
        const stock = list.find(s => s.Code === sym);
        if(stock?.ClosingPrice) return {price: parseFloat(stock.ClosingPrice.replace(/,/g,'')), currency:'TWD'};
      }catch(e2){}
      return {price: null, currency:'TWD', error: 'Fugle 401 + TWSE 失敗'};
    } else {
      // 美股：Finnhub
      const r = await fetch(`https://finnhub.io/api/v1/quote?symbol=${sym}&token=${FINNHUB_KEY}`, {signal: AbortSignal.timeout(8000)});
      const d = await r.json();
      if(d?.c && d.c > 0) return {price: d.c, currency:'USD'};
    }
  }catch(e){}
  return null;
}

async function addStock(){
  const mkt  = _addMkt || 'TW';
  const sym  = (document.getElementById('as-sym')?.value || '').trim().toUpperCase();
  const qty  = parseFloat(document.getElementById('as-qty')?.value);
  const cost = parseFloat(document.getElementById('as-cost')?.value);
  const msg  = document.getElementById('as-msg');
  if(!sym||!qty||!cost){msg.textContent='請填寫代號、股數和成本';return;}

  // check for existing position and offer merge
  const existing = stocks.find(s => s.sym === sym && s.mkt === mkt);
  if(existing){
    const doMerge = confirm(
      `已有 ${sym}（${fmt(existing.qty)} 股，均價 ${fmtD(existing.cost)}）\n` +
      `確定 → 合併計算加權均價\n取消 → 分開記錄`
    );
    if(doMerge){
      const newQty  = existing.qty + qty;
      const newCost = (existing.cost * existing.qty + cost * qty) / newQty;
      existing.qty  = newQty;
      existing.cost = parseFloat(newCost.toFixed(6));
      msg.innerHTML = `<span class="spinner"></span> 抓取股價中…`;
      const result  = await fetchPrice(sym, mkt);
      if(result?.price){ existing.price = result.price; existing.updatedAt = new Date().toLocaleTimeString('zh-TW'); }
      save(); renderStockList(); renderOverview();
      closeAddStockModal();
      showToast(`已合併 ${sym}，新均價 ${fmtD(existing.cost)}，共 ${fmt(existing.qty)} 股`,'✅');
      return;
    }
  }

  msg.innerHTML='<span class="spinner"></span> 抓取股價中…';
  const result = await fetchPrice(sym, mkt);
  const price  = result?.price ?? null;
  const currency = result?.currency ?? (mkt==='TW'?'TWD':'USD');
  const buydate = document.getElementById('as-buydate')?.value || new Date().toISOString().slice(0,10);
  const newId = Date.now();
  stocks.push({id:newId,mkt,sym,qty,cost,price,currency,buydate,updatedAt:price?new Date().toLocaleTimeString('zh-TW'):null,
    lots:[{id:newId, qty, cost, buydate}]});
  save(); renderStockList(); renderOverview();
  closeAddStockModal();
  showToast(price ? `已新增 ${sym}，現價 ${fmtD(price)} ${currency}` : `已新增 ${sym}（無法取得股價）`,'✅');
}

function stockMVTWD(s){
  if(!s.price)return null;
  return s.currency==='USD'?s.price*USD_RATE*s.qty:s.price*s.qty;
}
function stockCostTWD(s){
  return s.currency==='USD'?s.cost*USD_RATE*s.qty:s.cost*s.qty;
}

  const getPCT = s => { const mv=stockMVTWD(s),cv=stockCostTWD(s); return mv!=null&&cv>0?(mv-cv)/cv:-Infinity; };
  if(sortVal==='mv-desc')  sorted.sort((a,b)=>getMV(b)-getMV(a));
  if(sortVal==='mv-asc')   sorted.sort((a,b)=>getMV(a)-getMV(b));
  if(sortVal==='pnl-desc') sorted.sort((a,b)=>getPNL(b)-getPNL(a));

  closeStockMenus(id);

function deleteLot(stockId, lotId){
  const s = stocks.find(s=>s.id===stockId);
  if(!s) return;
  if(s.lots.length <= 1){
    openConfirmModal('刪除持股', `「${s.sym}」只剩一筆，刪除後將移除整檔持股。確定繼續？`, ()=>deleteStock(stockId));
    return;
  }
  s.lots = s.lots.filter(l=>l.id!==lotId);
  const totalQty = s.lots.reduce((sum,l)=>sum+l.qty, 0);
  s.qty  = totalQty;
  s.cost = parseFloat((s.lots.reduce((sum,l)=>sum+l.cost*l.qty,0)/totalQty).toFixed(6));
  s.buydate = s.lots.reduce((min,l)=>l.buydate<min?l.buydate:min, s.lots[0].buydate);
  save(); renderStockList(); renderOverview();
}

  try{
    const qty  = parseFloat(document.getElementById('al-qty').value);
    const cost = parseFloat(document.getElementById('al-cost').value);
    const date = document.getElementById('al-date').value || new Date().toISOString().slice(0,10);
    const msg  = document.getElementById('al-msg');
    if(!qty||!cost){ msg.textContent='請填寫股數和成本'; return; }
    const s = stocks.find(s=>s.id===addLotTargetId);
    if(!s){ msg.textContent='找不到持股，請重試'; return; }

    // 確保 lots 存在（防禦性）
    if(!s.lots) s.lots = [{id:s.id, qty:s.qty, cost:s.cost, buydate:s.buydate||date}];

    s.lots.push({id:Date.now(), qty, cost, buydate:date});
    const totalQty = s.lots.reduce((sum,l)=>sum+l.qty, 0);
    s.qty  = totalQty;
    s.cost = parseFloat((s.lots.reduce((sum,l)=>sum+l.cost*l.qty,0)/totalQty).toFixed(6));
    s.buydate = s.lots.reduce((min,l)=>l.buydate<min?l.buydate:min, s.lots[0].buydate);

    expandedStocks.add(s.id);
    save(); renderStockList(); renderOverview();
    closeAddLotModal();
    showToast(`${s.sym} 新增 ${fmtInt(qty)} 股，均價更新為 ${fmtD(s.cost)}`,'✅');
  }catch(err){
    document.getElementById('al-msg').textContent = '發生錯誤：'+err.message;
  }
}

function addBank(){

function deleteBank(id){

}

function _buildBankMenu(id){
  const b = banks.find(x=>x.id===id); if(!b) return null;
  const canUndo = bankPrev[id] !== undefined;
  const el = document.createElement('div');
  el.id = `bmenu-${id}`;
  el.style.cssText = 'display:none;position:fixed;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,0.22);z-index:9999;width:max-content';
  el.innerHTML = `
    <button onclick="openBankActionModal('add',${id});closeBankMenus()" style="display:block;width:100%;padding:13px 16px;text-align:left;font-size:13px;font-weight:600;color:var(--green);background:none;border:none;cursor:pointer;font-family:inherit">＋ 增加</button>
    <div style="height:1px;background:var(--border);margin:0 8px"></div>
    <button onclick="openBankActionModal('sub',${id});closeBankMenus()" style="display:block;width:100%;padding:13px 16px;text-align:left;font-size:13px;font-weight:600;color:var(--red);background:none;border:none;cursor:pointer;font-family:inherit">− 減少</button>
    <div style="height:1px;background:var(--border);margin:0 8px"></div>
    <button onclick="openBankActionModal('set',${id});closeBankMenus()" style="display:block;width:100%;padding:13px 16px;text-align:left;font-size:13px;font-weight:600;color:var(--accent);background:none;border:none;cursor:pointer;font-family:inherit">更新餘額</button>
    <div style="height:1px;background:var(--border);margin:0 8px"></div>
    <button onclick="undoBankAmount(${id});closeBankMenus()" style="display:block;width:100%;padding:13px 16px;text-align:left;font-size:13px;font-weight:600;background:none;border:none;cursor:pointer;font-family:inherit;${canUndo?'color:var(--text2)':'color:var(--text3);opacity:0.4;pointer-events:none'}">↩ 復原</button>
    <div style="height:1px;background:var(--border);margin:0 8px"></div>
    <button onclick="deleteBank(${id});closeBankMenus()" style="display:block;width:100%;padding:13px 16px;text-align:left;font-size:13px;font-weight:600;color:var(--red);background:none;border:none;cursor:pointer;font-family:inherit">刪除</button>`;
  document.body.appendChild(el);
  return el;
}
function toggleBankMenu(id, btn){
  closeBankMenus(id);
  let menu = document.getElementById(`bmenu-${id}`);
  if(menu){ const isOpen = menu.style.display==='block'; if(isOpen){menu.style.display='none';return;} }
  else { menu = _buildBankMenu(id); if(!menu) return; }
  menu.style.display = 'block';
  const r = btn.getBoundingClientRect();
  const menuH = menu.offsetHeight || 200;
  const spaceBelow = window.innerHeight - r.bottom;
  if(spaceBelow < menuH + 8 && r.top > menuH + 8){
    menu.style.top = (r.top - menuH - 4) + 'px';
  } else {
    menu.style.top = (r.bottom + 4) + 'px';
  }
  menu.style.right = (window.innerWidth - r.right) + 'px';
  menu.style.left = 'auto';
}
document.addEventListener('click', e=>{
  if(!e.target.closest('[id^="bmenu-"]') && !e.target.closest('button[onclick*="toggleBankMenu"]')){
    closeBankMenus();
  }
});

/* ── Bank Action Modal ── */
let _bankActionId = null, _bankAction = null;
const _bankActionCfg = {
  add: { title:'增加金額', placeholder:'輸入增加金額', btn:'＋ 增加',  btnStyle:'background:var(--green)' },
  sub: { title:'減少金額', placeholder:'輸入減少金額', btn:'− 減少',   btnStyle:'background:var(--red)' },
  set: { title:'更新餘額', placeholder:'輸入新餘額',   btn:'確認更新', btnStyle:'background:var(--accent)' },
};
function openBankActionModal(action, id){
  _bankActionId = id; _bankAction = action;
  const b = banks.find(b=>b.id===id);
  if(!b) return;
  const cfg = _bankActionCfg[action];
  document.getElementById('ba-title').textContent   = cfg.title;
  document.getElementById('ba-name').textContent    = `${b.name}　${b.currency||'TWD'}`;
  document.getElementById('ba-balance').textContent = `現餘額 ${fmtInt(b.amount)}`;
  document.getElementById('ba-input').placeholder   = cfg.placeholder;
  document.getElementById('ba-input').value         = action==='set' ? b.amount : '';
  document.getElementById('ba-okbtn').textContent   = cfg.btn;
  document.getElementById('ba-okbtn').style.cssText += ';'+cfg.btnStyle;
  document.getElementById('ba-msg').textContent     = '';
  document.getElementById('bank-action-modal').style.display = 'flex';
  setTimeout(()=>{ const inp=document.getElementById('ba-input'); inp.focus(); if(action==='set') inp.select(); },100);
}
function closeBankActionModal(){
  document.getElementById('bank-action-modal').style.display='none';
  _bankActionId=null; _bankAction=null;
}
function doBankAction(){
  const val = parseFloat(document.getElementById('ba-input').value);
  const msg = document.getElementById('ba-msg');
  if(isNaN(val)||val<0){ msg.textContent='請輸入有效金額'; return; }
  const b = banks.find(b=>b.id===_bankActionId);
  if(!b) return;
  bankPrev[_bankActionId] = b.amount;
  if(_bankAction==='add')      b.amount = b.amount + val;
  else if(_bankAction==='sub') b.amount = Math.max(0, b.amount - val);
  else                         b.amount = val;
  save(); renderBankList(); renderOverview();
  const labels = {add:`增加 ${fmtInt(val)}`, sub:`減少 ${fmtInt(val)}`, set:`更新為 ${fmtInt(val)}`};
  showToast(`${labels[_bankAction]}，餘額 ${fmtInt(b.amount)}`,'✅');
  closeBankActionModal();
}

function adjustBankAmount(id, sign){
  const input = document.getElementById(`bedit-${id}`);
  const val = parseFloat(input.value);
  if(isNaN(val)||val<=0){ showToast('請先輸入金額','⚠️'); return; }
  const b = banks.find(b=>b.id===id);
  if(!b) return;
  bankPrev[id] = b.amount;
  b.amount = Math.max(0, b.amount + sign * val);
  save(); renderBankList(); renderOverview();
  showToast(`${sign>0?'增加':'減少'} ${fmtInt(val)}，餘額 ${fmtInt(b.amount)}`, sign>0?'➕':'➖');
}

function updateBankAmount(id){
  const input = document.getElementById(`bedit-${id}`);
  const val = parseFloat(input.value);
  if(isNaN(val)||val<0){ showToast('請輸入有效金額','⚠️'); return; }
  const b = banks.find(b=>b.id===id);
  if(!b) return;
  openConfirmModal('更新金額', `確定將「${b.name}」更新為 ${val.toLocaleString('zh-TW')} ${b.currency||'TWD'}？`, ()=>{
    bankPrev[id] = b.amount;
    b.amount = val;
    save(); renderBankList(); renderOverview();
    showToast('金額已更新 · 可點復原回上一筆','✅');
  }, '確認更新', false);
}

function undoBankAmount(id){
  const prev = bankPrev[id];
  if(prev==null){ showToast('無可復原的紀錄','⚠️'); return; }
  const b = banks.find(b=>b.id===id);
  if(!b) return;
  openConfirmModal('復原金額', `確定將「${b.name}」復原為 ${prev.toLocaleString('zh-TW')} ${b.currency||'TWD'}？`, ()=>{
    b.amount = prev;
    delete bankPrev[id];
    save(); renderBankList(); renderOverview();
    showToast('已復原上一筆金額','↩️');
  }, '確認復原', false);
}

/* ── Overview ── */
function renderOverview(){
  const totalStockMV = stocks.reduce((a,s)=>{const v=stockMVTWD(s);return a+(v||0);},0);
  const totalCost    = stocks.reduce((a,s)=>a+stockCostTWD(s),0);
  const totalBank    = banks.reduce((a,b)=>a+bankTWD(b),0);
  const total        = totalStockMV + totalBank;
  const pnl          = totalStockMV - totalCost;
  const pct          = totalCost>0?pnl/totalCost*100:0;

  // Snapshot reminder
  const _today = new Date().toISOString().slice(0,10);
  const reminderEl = document.getElementById('snapshot-reminder');
  if(reminderEl && reminderEl.style.display !== 'none'){
    const hasToday = snapshots.some(s=>s.date===_today);
    reminderEl.style.display = (total>0 && !hasToday) ? 'flex' : 'none';
  } else if(reminderEl && reminderEl.style.display === 'none' && !reminderEl._checkedOnce){
    reminderEl._checkedOnce = true;
    const hasToday = snapshots.some(s=>s.date===_today);
    if(total>0 && !hasToday) reminderEl.style.display = 'flex';
  }

  document.getElementById('header-total').textContent = 'NT$ '+fmtInt(total);
  document.getElementById('ov-total-big').textContent  = 'NT$ '+fmtInt(total);

  // Yesterday comparison (Feature 6)
  const today = new Date().toISOString().slice(0,10);
  const ydSnap = snapshots.filter(s=>s.date<today).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const ydEl = document.getElementById('ov-yesterday');
  if(ydEl){
    if(ydSnap){
      const diff=total-ydSnap.total, pct2=diff/ydSnap.total*100, isUp=diff>=0;
      ydEl.innerHTML=`<span style="color:${isUp?'var(--green)':'var(--red)'};font-weight:700">${isUp?'▲':'▼'} ${isUp?'+':''}${fmtInt(diff)} (${isUp?'+':''}${fmtD(pct2,2)}%)</span> <span style="color:var(--text3)">vs 昨日</span>`;
    } else {
      ydEl.textContent='';
    }
  }
  const totalRealized = realized.reduce((a,r)=>a+(r.pnlTWD ?? Math.round(r.pnl*(r.mkt==='US'?(USD_RATE||1):1))), 0);
  const realizedEl = document.getElementById('ov-realized');
  realizedEl.textContent = (totalRealized>=0?'+':'')+fmtInt(totalRealized);
  realizedEl.className = 'metric-value '+(totalRealized>=0?'up':'down');
  document.getElementById('ov-stock').textContent  = fmtInt(totalStockMV);
  document.getElementById('ov-bank').textContent   = fmtInt(totalBank);
  const pnlEl = document.getElementById('ov-pnl');
  pnlEl.textContent = (pnl>=0?'+':'')+fmtInt(pnl);
  pnlEl.className = 'metric-value '+(pnl>=0?'up':'down');
  const pctEl = document.getElementById('ov-pct');
  pctEl.textContent = (pct>=0?'+':'')+fmtD(pct,2)+'%';
  pctEl.className = 'metric-sub '+(pct>=0?'up':'down');

  /* Donut chart */
  const twMV = stocks.filter(s=>s.mkt==='TW').reduce((a,s)=>a+(stockMVTWD(s)||0),0);
  const usMV = stocks.filter(s=>s.mkt==='US').reduce((a,s)=>a+(stockMVTWD(s)||0),0);
  const segments=[{label:'台股',val:twMV,color:'#7c6fff'},{label:'美股',val:usMV,color:'#ff6b6b'},{label:'存款',val:totalBank,color:'#ffc850'}];
  const svgEl = document.getElementById('donut-svg');
  const R=40,cx=50,cy=50,sw=18,circ=2*Math.PI*R;
  let offset=0;
  let paths='<circle cx="50" cy="50" r="40" fill="none" stroke="#e5e5ea" stroke-width="18"/>';
  segments.forEach(seg=>{
    if(!total||!seg.val){return;}
    const frac=seg.val/total;
    const dash=frac*circ;
    paths+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${seg.color}" stroke-width="${sw}" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-offset}" style="transform:rotate(-90deg);transform-origin:center"/>`;
    offset+=dash;
  });
  svgEl.innerHTML=paths;
  const legend=document.getElementById('donut-legend');
  legend.innerHTML=segments.map(seg=>`
    <div class="legend-item">
      <div class="legend-dot" style="background:${seg.color}"></div>
      <div class="legend-name">${seg.label}</div>
      <div class="legend-pct" style="color:${seg.color}">${total>0?fmtD(seg.val/total*100,1):'0'}%</div>
    </div>`).join('');

  /* PnL bars */
  const pnlWrap = document.getElementById('pnl-bars');
  if(!pnlWrap) return;   // 損益頁已移除，後續排行榜渲染略過
  // 合併相同股票，加權平均年化報酬率，並分台股/美股
  const pnlMap = {};
  stocks.forEach(s=>{
    const mv  = stockMVTWD(s)||stockCostTWD(s);
    const cv  = stockCostTWD(s);
    const pnl = mv - cv;
    const days = s.buydate ? Math.max(1, Math.floor((Date.now()-new Date(s.buydate))/86400000)) : 365;
    if(!pnlMap[s.sym]) pnlMap[s.sym] = {pnl:0, costSum:0, costDays:0, mkt:s.mkt, totalQty:0, totalCostAmt:0, price:s.price, currency:s.currency};
    pnlMap[s.sym].pnl += pnl;
    pnlMap[s.sym].costSum += cv;
    pnlMap[s.sym].costDays += cv * days;
    pnlMap[s.sym].totalQty += s.qty;
    pnlMap[s.sym].totalCostAmt += s.cost * s.qty;
    if(s.price) pnlMap[s.sym].price = s.price;
  });
  const pnlItems = Object.entries(pnlMap).map(([sym,v])=>{
    const avgDays  = v.costSum > 0 ? Math.round(v.costDays / v.costSum) : 365;
    const annReturn = v.costSum > 0 ? v.pnl / v.costSum * (365 / Math.max(avgDays,1)) * 100 : 0;
    const avgCost  = v.totalQty > 0 ? v.totalCostAmt / v.totalQty : 0;
    return {sym, pnl:v.pnl, costSum:v.costSum, annReturn, avgDays,
            mkt:v.mkt, totalQty:v.totalQty, avgCost, price:v.price, currency:v.currency};
  });

  // ── PnL Summary ──
  const sumEl = document.getElementById('pnl-summary');
  if(sumEl && pnlItems.length){
    const totalPnl  = pnlItems.reduce((a,p)=>a+p.pnl, 0);
    const totalCost = pnlItems.reduce((a,p)=>a+p.costSum, 0);
    const totalPct  = totalCost > 0 ? totalPnl/totalCost*100 : 0;
    const wtAnn     = totalCost > 0
      ? pnlItems.reduce((a,p)=>a + p.annReturn*(p.costSum/totalCost), 0) : 0;
    const sc = totalPnl>=0 ? 'var(--green)' : 'var(--red)';
    sumEl.style.display = 'block';
    document.getElementById('pnl-sum-val').textContent = (totalPnl>=0?'+':'')+fmtInt(totalPnl);
    document.getElementById('pnl-sum-val').style.color = sc;
    document.getElementById('pnl-sum-pct').textContent = (totalPct>=0?'+':'')+fmtD(totalPct,2)+'%';
    document.getElementById('pnl-sum-pct').style.color = sc;
    document.getElementById('pnl-sum-ann').textContent = (wtAnn>=0?'+':'')+fmtD(wtAnn,1)+'%';
    document.getElementById('pnl-sum-ann').style.color = wtAnn>=0?'var(--green)':'var(--red)';
  } else if(sumEl) { sumEl.style.display='none'; }

  // ── Sort within each market group ──
  function applySortToItems(items){
    return [...items].sort((a,b)=>{
      let va, vb;
      if(pnlSort==='pnl'){ va=a.pnl; vb=b.pnl; }
      else if(pnlSort==='pct'){ va=a.costSum?a.pnl/a.costSum:0; vb=b.costSum?b.pnl/b.costSum:0; }
      else { va=a.annReturn; vb=b.annReturn; }
      return pnlSortDir==='desc' ? vb-va : va-vb;
    });
  }
  const twItems = applySortToItems(pnlItems.filter(p=>p.mkt==='TW'));
  const usItems = applySortToItems(pnlItems.filter(p=>p.mkt==='US'));
  if(!pnlItems.length){pnlWrap.innerHTML='<div class="empty">尚無股票損益資料</div>';return;}
  const maxAbs = Math.max(...pnlItems.map(p=>Math.abs(p.pnl)),1);

  _updatePnlSortBtns();

  function renderPnlGroup(items){
    return items.map(p=>{
      const isUp   = p.pnl >= 0;
      const col    = isUp ? '#e07070' : '#ff3b30';
      const pctVal = p.costSum > 0 ? p.pnl/p.costSum*100 : 0;
      const annCol = p.annReturn >= 0 ? 'var(--green)' : 'var(--red)';
      const costLabel = p.mkt==='US'
        ? `$${fmtD(p.avgCost,2)} USD`
        : fmtD(p.avgCost,2);
      return `<div class="glass-row">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
          <div style="min-width:0;flex:1">
            <div style="display:flex;align-items:center;gap:5px;margin-bottom:2px">
              <span class="badge badge-${p.mkt.toLowerCase()}" style="flex-shrink:0">${p.mkt}</span>
              <span style="font-size:14px;font-weight:700;color:var(--text);letter-spacing:-0.3px">${p.sym}</span>
            </div>
            <div style="font-size:12px;color:var(--text3);margin-bottom:2px">
              均 <span style="color:var(--text2);font-weight:600">${costLabel}</span>
              <span style="color:var(--border)">·</span>
              現 <span style="color:var(--text2);font-weight:600">${p.price?fmtD(p.price,2):'—'}</span>
            </div>
            <div style="font-size:12px;color:var(--text3)">
              持有 <span style="color:var(--text2);font-weight:600">${p.avgDays}</span> 天
              <span style="color:var(--border)">·</span>
              年化 <span style="color:${annCol};font-weight:700">${p.annReturn>=0?'+':''}${fmtD(p.annReturn,1)}%</span>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
            <span style="font-size:14px;font-weight:700;color:${col};letter-spacing:-0.3px;white-space:nowrap">${isUp?'+':''}${fmtInt(p.pnl)}</span>
            <span style="background:${col};color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;white-space:nowrap">${isUp?'+':''}${fmtD(pctVal,2)}%</span>
          </div>
        </div>
      </div>`;
    }).join('');
  }
  const sectionLabel = label => `<div style="font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin:12px 0 2px">${label}</div>`;
  let html = '';
  if(twItems.length) html += sectionLabel('台股') + renderPnlGroup(twItems);
  if(usItems.length) html += sectionLabel('美股') + renderPnlGroup(usItems);
  pnlWrap.innerHTML = html;
}

let sellTargetId = null;
function openSellModal(id){
  sellTargetId = id;
  const s = stocks.find(s=>s.id===id);
  if(!s) return;
  document.getElementById('sell-sym-label').textContent = s.sym;
  document.getElementById('sell-qty').value = '';
  document.getElementById('sell-price').value = s.price || '';
  document.getElementById('sell-date').value = new Date().toISOString().slice(0,10);
  document.getElementById('sell-preview').textContent = '';
  const modal = document.getElementById('sell-modal');
  modal.style.display = 'flex';
  document.getElementById('sell-qty').addEventListener('input', updateSellPreview);
  document.getElementById('sell-price').addEventListener('input', updateSellPreview);
}
function updateSellPreview(){
  const s = stocks.find(s=>s.id===sellTargetId);
  if(!s) return;
  const qty = parseFloat(document.getElementById('sell-qty').value);
  const price = parseFloat(document.getElementById('sell-price').value);
  if(!qty||!price) return;
  const revenue = price * qty;
  const costPerShare = s.cost;
  const pnl = (price - costPerShare) * qty;
  const pct = pnl / (costPerShare * qty) * 100;
  const col = pnl>=0?'var(--green)':'var(--red)';
  document.getElementById('sell-preview').innerHTML =
    `損益預覽：<span style="color:${col};font-weight:600">${pnl>=0?'+':''}${fmtInt(pnl)} (${fmtD(pct,1)}%)</span>`;
}
function closeSellModal(){
  document.getElementById('sell-modal').style.display='none';
  sellTargetId = null;
}
function confirmSell(){
  const s = stocks.find(s=>s.id===sellTargetId);
  if(!s) return;
  const qty = parseFloat(document.getElementById('sell-qty').value);
  const price = parseFloat(document.getElementById('sell-price').value);
  const date = document.getElementById('sell-date').value;
  if(!qty||!price){ alert('請填寫賣出數量和價格'); return; }
  if(qty > s.qty){ alert(`持股不足，目前持有 ${s.qty} 股`); return; }

  const rate    = s.mkt === 'US' ? (USD_RATE||1) : 1;
  const pnl     = (price - s.cost) * qty;          // 原幣
  const pnlTWD  = Math.round(pnl * rate);           // 台幣
  const pct     = pnl / (s.cost * qty) * 100;
  realized.push({id:Date.now(), sym:s.sym, mkt:s.mkt, qty, buyPrice:s.cost, sellPrice:price, pnl, pnlTWD, pct, buydate:s.buydate, selldate:date});

  if(qty === s.qty){
    stocks = stocks.filter(st=>st.id!==sellTargetId);
  } else {
    // FIFO：從最早的 lot 開始扣
    if(!s.lots) s.lots = [{id:s.id, qty:s.qty, cost:s.cost, buydate:s.buydate||date}];
    let remaining = qty;
    const byDate = s.lots.slice().sort((a,b)=>a.buydate.localeCompare(b.buydate));
    for(const ref of byDate){
      if(remaining <= 0) break;
      const lot = s.lots.find(l=>l.id===ref.id);
      if(!lot) continue;
      if(lot.qty <= remaining){
        remaining -= lot.qty;
        s.lots = s.lots.filter(l=>l.id!==lot.id);
      } else {
        lot.qty -= remaining;
        remaining = 0;
      }
    }
    // 重算加權均價與總股數
    const totalQty = s.lots.reduce((sum,l)=>sum+l.qty, 0);
    s.qty  = totalQty;
    s.cost = parseFloat((s.lots.reduce((sum,l)=>sum+l.cost*l.qty,0)/totalQty).toFixed(6));
    s.buydate = s.lots.reduce((min,l)=>l.buydate<min?l.buydate:min, s.lots[0].buydate);
  }

  save();
  renderStockList();
  renderRealizedList();
  renderOverview();
  closeSellModal();
  showToast(`${s.sym} 賣出 ${qty} 股，損益 ${pnlTWD>=0?'+':''}NT$ ${fmtInt(pnlTWD)}`,'💰');
}

/* ── Snapshot ── */
function takeSnapshot(auto=false){
  const today = new Date().toISOString().slice(0,10);
  const totalStock = stocks.reduce((a,s)=>{const v=stockMVTWD(s);return a+(v||0);},0);
  const totalBank  = banks.reduce((a,b)=>a+bankTWD(b),0);
  const total = totalStock+totalBank;
  if(total<=0){ if(!auto) showToast('請先新增股票或存款','⚠️'); return; }
  const exists = snapshots.find(s=>s.date===today);
  if(auto && exists) return;
  if(exists) snapshots = snapshots.filter(s=>s.date!==today);
  snapshots.push({date:today,total,stock:totalStock,bank:totalBank});
  snapshots.sort((a,b)=>a.date.localeCompare(b.date));
  if(snapshots.length>3650) snapshots=snapshots.slice(-3650);
  localStorage.setItem('pt_snapshots',JSON.stringify(snapshots));
  renderOverview();
  if(!auto){ showToast('今日資產已記錄 📸'); renderCharts(); }
}

const FEED_PALETTE = ['#3a9bff','#e8456b','#9b5cf0','#ff3b30','#ff8c42','#1abc9c','#5b6cff','#ff5fa2','#00b894','#7c6fff'];
function feedColor(sym){
  let h=0; for(let i=0;i<sym.length;i++) h=(h*31+sym.charCodeAt(i))>>>0;
  return FEED_PALETTE[h % FEED_PALETTE.length];
}
function feedShort(sym){ return sym.length<=4 ? sym : sym.slice(0,4); }
function feedStoryCode(sym){ return sym.length<=3 ? sym : sym.slice(0,3); }
function feedRelDate(d){
  if(!d) return '';
  const today=new Date().toISOString().slice(0,10);
  if(d===today) return '今天';
  const yd=new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(d===yd) return '昨天';
  const days=Math.floor((new Date(today)-new Date(d))/86400000);
  if(days>0 && days<=30) return days+' 天前';
  return d;
}

function renderAllTrend(){
  const canvas=document.getElementById('trend-canvas');
  const pcanvas=document.getElementById('period-canvas');
  const empty=document.getElementById('trend-empty');
  const stats=document.getElementById('trend-stats');
  const pstats=document.getElementById('period-stats');
  if(!canvas) return;
  if(pcanvas) pcanvas.style.display='none';
  if(pstats)  pstats.style.display='none';

  if(snapshots.length===0){
    canvas.style.display='none'; empty.style.display='block'; stats.style.display='none';
    document.getElementById('trend-empty').innerHTML='<div style="font-size:28px;margin-bottom:8px">📈</div><div style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:4px">尚無走勢資料</div><div style="font-size:12px;line-height:1.6">點「記錄今日」開始追蹤<br>累積 2 天後顯示曲線</div>';
    return;
  }

  // Feature 7: single point state
  if(snapshots.length===1){
    empty.style.display='none'; stats.style.display='none';
    canvas.style.display='block';
    const H=100, W=canvas.parentElement?.clientWidth||340;
    canvas.width=W*devicePixelRatio; canvas.height=H*devicePixelRatio;
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    const ctx=canvas.getContext('2d');
    ctx.scale(devicePixelRatio,devicePixelRatio);
    ctx.clearRect(0,0,W,H);
    ctx.beginPath(); ctx.arc(W/2,H/2,6,0,Math.PI*2);
    ctx.fillStyle='#e07070'; ctx.fill();
    ctx.beginPath(); ctx.arc(W/2,H/2,12,0,Math.PI*2);
    ctx.fillStyle='rgba(224,112,112,0.2)'; ctx.fill();
    ctx.font='bold 12px -apple-system,sans-serif'; ctx.fillStyle='var(--text2)'; ctx.textAlign='center';
    ctx.fillText('✓ 第一筆已記錄：'+snapshots[0].date, W/2, H/2+28);
    ctx.font='11px -apple-system,sans-serif'; ctx.fillStyle='var(--text3)';
    ctx.fillText('NT$ '+fmtInt(snapshots[0].total), W/2, H/2+46);
    return;
  }

  empty.style.display='none'; canvas.style.display='block'; stats.style.display='block';

  // pick field & colors based on trendData
  const fieldMap = { total:'total', stock:'stock', bank:'bank' };
  const field = fieldMap[trendData] || 'total';
  const lineColors = { total:'#3478f6', stock:'#e07070', bank:'#ff9f0a' };
  const gradColors = {
    total: ['rgba(52,120,246,0.18)','rgba(52,120,246,0)'],
    stock: ['rgba(224,112,112,0.18)','rgba(224,112,112,0)'],
    bank:  ['rgba(255,159,10,0.18)','rgba(255,159,10,0)'],
  };
  const lineCol = lineColors[trendData] || lineColors.total;
  const [gradTop, gradBot] = gradColors[trendData] || gradColors.total;

  const vals = snapshots.map(s => (s[field] ?? 0));
  const first = vals[0], last = vals[vals.length-1];
  const diff=last-first, pct=diff/first*100, isUp=diff>=0;
  const col=isUp?'var(--green)':'var(--red)';
  document.getElementById('ts-days').textContent   = snapshots.length;
  document.getElementById('ts-growth').textContent = (isUp?'+':'')+fmtInt(diff);
  document.getElementById('ts-growth').style.color = col;
  document.getElementById('ts-pct').textContent    = (isUp?'+':'')+fmtD(pct,1)+'%';
  document.getElementById('ts-pct').style.color    = col;

  const H=200, W=canvas.offsetWidth||(canvas.parentElement?.clientWidth-32)||340;
  canvas.width=W*devicePixelRatio; canvas.height=H*devicePixelRatio;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(devicePixelRatio,devicePixelRatio);
  const minV=Math.min(...vals), maxV=Math.max(...vals), range=maxV-minV||1;
  const theme = getTheme();
  // pad.l=54 for Y-axis labels; pad.r=24 so end-dot edge is visually equal to left margin
  const pad={t:14,r:24,b:12,l:54};
  const cw=W-pad.l-pad.r, ch=H-pad.t-pad.b;
  const tx=i=>pad.l+(i/(snapshots.length-1))*cw;
  const ty=v=>pad.t+ch-((v-minV)/range)*ch;

  // Grid lines
  ctx.strokeStyle=theme.grid; ctx.lineWidth=1;
  [0.25,0.5,0.75].forEach(r=>{ const y=pad.t+ch*r; ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(pad.l+cw,y); ctx.stroke(); });

  // Y-axis — smart step labels
  const yStep = niceYStep(range);
  const yStart = Math.ceil(minV / yStep) * yStep;
  ctx.font='10px -apple-system,sans-serif'; ctx.fillStyle=theme.yAxis; ctx.textAlign='right';
  for(let yv = yStart; yv <= maxV + yStep*0.01; yv += yStep){
    if(yv < minV - yStep*0.1) continue;
    const yy = ty(yv);
    if(yy < pad.t - 4 || yy > pad.t + ch + 4) continue;
    ctx.fillText(fmtY(yv), pad.l - 6, yy + 3);
  }

  const grad=ctx.createLinearGradient(0,pad.t,0,pad.t+ch);
  grad.addColorStop(0, gradTop);
  grad.addColorStop(1, gradBot);
  ctx.beginPath(); ctx.moveTo(tx(0),ty(vals[0]));
  for(let i=1;i<vals.length;i++) ctx.lineTo(tx(i),ty(vals[i]));
  ctx.lineTo(tx(vals.length-1),pad.t+ch); ctx.lineTo(tx(0),pad.t+ch);
  ctx.closePath(); ctx.fillStyle=grad; ctx.fill();
  ctx.beginPath(); ctx.moveTo(tx(0),ty(vals[0]));
  for(let i=1;i<vals.length;i++) ctx.lineTo(tx(i),ty(vals[i]));
  ctx.strokeStyle=lineCol; ctx.lineWidth=2.5; ctx.lineJoin='round'; ctx.stroke();
  // Start dot (subtle)
  const sx=tx(0), sy=ty(vals[0]);
  ctx.beginPath(); ctx.arc(sx,sy,4,0,Math.PI*2); ctx.fillStyle=lineCol+'55'; ctx.fill();
  ctx.beginPath(); ctx.arc(sx,sy,2,0,Math.PI*2); ctx.fillStyle=lineCol+'99'; ctx.fill();
  // End dot (prominent = current value)
  const lx=tx(vals.length-1), ly=ty(vals[vals.length-1]);
  ctx.beginPath(); ctx.arc(lx,ly,8,0,Math.PI*2); ctx.fillStyle=lineCol+'33'; ctx.fill();
  ctx.beginPath(); ctx.arc(lx,ly,4,0,Math.PI*2); ctx.fillStyle=lineCol; ctx.fill();

  // ── Touch/click crosshair overlay ──
  _lineMeta = {W,H,vals,pad,lineCol,field,snapshots:snapshots.slice()};
  if(!canvas._lineInteractionReady){
    canvas._lineInteractionReady = true;
    let _dismissTimer = null;
    function _lineHit(clientX){
      if(!_lineMeta) return;
      clearTimeout(_dismissTimer);
      const rect=canvas.getBoundingClientRect();
      const xInCanvas=(clientX-rect.left)/rect.width*_lineMeta.W;
      const n=_lineMeta.vals.length;
      const idx=Math.round((xInCanvas-_lineMeta.pad.l)/(_lineMeta.W-_lineMeta.pad.l-_lineMeta.pad.r)*(n-1));
      _lineTouchIdx=Math.max(0,Math.min(n-1,idx));
      renderAllTrend();
    }
    canvas.addEventListener('click',e=>{
      if(!_lineMeta) return;
      const rect=canvas.getBoundingClientRect();
      const xInCanvas=(e.clientX-rect.left)/rect.width*_lineMeta.W;
      const n=_lineMeta.vals.length;
      const idx=Math.round((xInCanvas-_lineMeta.pad.l)/(_lineMeta.W-_lineMeta.pad.l-_lineMeta.pad.r)*(n-1));
      const newIdx=Math.max(0,Math.min(n-1,idx));
      // 同一點再點 → 關閉
      if(newIdx===_lineTouchIdx){ _lineTouchIdx=-1; }
      else { _lineTouchIdx=newIdx; }
      renderAllTrend();
    });
    canvas.addEventListener('touchstart',e=>{
      e.preventDefault();
      clearTimeout(_dismissTimer);
      _lineHit(e.touches[0].clientX);
    },{passive:false});
    canvas.addEventListener('touchmove', e=>{e.preventDefault();_lineHit(e.touches[0].clientX);},{passive:false});
    canvas.addEventListener('touchend', ()=>{
      _dismissTimer=setTimeout(()=>{_lineTouchIdx=-1;renderAllTrend();},1400);
    });
  }
  if(_lineTouchIdx>=0 && _lineTouchIdx<vals.length){
    const xi=tx(_lineTouchIdx), yi=ty(vals[_lineTouchIdx]);
    // Crosshair
    ctx.save(); ctx.setLineDash([3,3]);
    ctx.strokeStyle=theme.crosshair; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(xi,pad.t); ctx.lineTo(xi,pad.t+ch); ctx.stroke();
    ctx.restore();
    // Dot
    ctx.beginPath(); ctx.arc(xi,yi,10,0,Math.PI*2); ctx.fillStyle=lineCol+'33'; ctx.fill();
    ctx.beginPath(); ctx.arc(xi,yi,5, 0,Math.PI*2); ctx.fillStyle=lineCol; ctx.fill();
    // Tooltip
    const snap=_lineMeta.snapshots[_lineTouchIdx];
    const fval=snap[field]??snap.total;
    const TW=124,TH=40;
    let ttx=xi-TW/2; if(ttx<pad.l) ttx=pad.l; if(ttx+TW>W-pad.r) ttx=W-pad.r-TW;
    const tty=yi-TH-14>pad.t ? yi-TH-14 : yi+14;
    const rr=7;
    ctx.beginPath();
    ctx.moveTo(ttx+rr,tty); ctx.lineTo(ttx+TW-rr,tty);
    ctx.quadraticCurveTo(ttx+TW,tty,ttx+TW,tty+rr);
    ctx.lineTo(ttx+TW,tty+TH-rr);
    ctx.quadraticCurveTo(ttx+TW,tty+TH,ttx+TW-rr,tty+TH);
    ctx.lineTo(ttx+rr,tty+TH);
    ctx.quadraticCurveTo(ttx,tty+TH,ttx,tty+TH-rr);
    ctx.lineTo(ttx,tty+rr);
    ctx.quadraticCurveTo(ttx,tty,ttx+rr,tty);
    ctx.closePath();
    ctx.fillStyle=theme.tooltipBg; ctx.fill();
    ctx.strokeStyle=theme.tooltipBorder; ctx.lineWidth=1; ctx.stroke();
    ctx.textAlign='center';
    ctx.font='10px -apple-system,sans-serif'; ctx.fillStyle=theme.text2;
    ctx.fillText(snap.date, ttx+TW/2, tty+14);
    ctx.font='bold 12px -apple-system,sans-serif'; ctx.fillStyle=theme.text;
    ctx.fillText('NT$ '+fmtInt(fval), ttx+TW/2, tty+30);
  }
}

/* ── 每月 / 每年 bar chart ── */
function renderPeriodTrend(mode){
  const canvas  = document.getElementById('trend-canvas');
  const pcanvas = document.getElementById('period-canvas');
  const empty   = document.getElementById('trend-empty');
  const stats   = document.getElementById('trend-stats');
  const pstats  = document.getElementById('period-stats');
  if(!pcanvas) return;

  // hide full-trend canvas & stats
  canvas.style.display='none';
  stats.style.display='none';

  if(!snapshots.length){
    pcanvas.style.display='none';
    pstats.style.display='none';
    empty.style.display='block';
    document.getElementById('trend-empty').innerHTML='<div style="font-size:28px;margin-bottom:8px">📈</div><div style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:4px">尚無走勢資料</div><div style="font-size:12px;line-height:1.6">點「記錄今日」開始追蹤<br>累積 2 天後顯示曲線</div>';
    return;
  }
  empty.style.display='none';

  // ── Aggregate: last snapshot per period ──
  const field = trendData === 'stock' ? 'stock' : trendData === 'bank' ? 'bank' : 'total';
  const barColors = { total: ['rgba(52,120,246,0.82)','rgba(255,59,48,0.75)'], stock: ['rgba(224,112,112,0.85)','rgba(255,59,48,0.75)'], bank: ['rgba(255,159,10,0.85)','rgba(255,59,48,0.75)'] };
  const [barUp, barDn] = barColors[trendData] || barColors.total;
  const pctUp = trendData==='bank' ? '#ff9f0a' : trendData==='stock' ? '#e07070' : '#3478f6';

  const buckets={};
  snapshots.forEach(s=>{
    const key = mode==='month'
      ? s.date.slice(0,7)   // "2025-05"
      : s.date.slice(0,4);  // "2025"
    buckets[key] = s[field] ?? 0;   // last snapshot in each period wins
  });
  const keys=Object.keys(buckets).sort();
  const vals=keys.map(k=>buckets[k]);

  // Need ≥1 period
  if(!keys.length){ pcanvas.style.display='none'; pstats.style.display='none'; return; }

  // ── Draw bar chart ──
  pcanvas.style.display='block';
  pstats.style.display='block';

  const W = pcanvas.parentElement?.clientWidth||340;
  const barCount=keys.length;
  const barW=Math.max(28, Math.min(52, (W-32)/barCount - 6));
  const H = 180;
  pcanvas.width=W*devicePixelRatio; pcanvas.height=H*devicePixelRatio;
  pcanvas.style.width=W+'px'; pcanvas.style.height=H+'px';
  const ctx=pcanvas.getContext('2d');
  ctx.scale(devicePixelRatio,devicePixelRatio);
  ctx.clearRect(0,0,W,H);

  const maxV=Math.max(...vals)||1;
  const minV=Math.min(...vals);
  const chartH=H-40; // leave 40px bottom for labels
  const chartTop=10;
  const totalW=barCount*(barW+6)-6;
  const startX=(W-totalW)/2;

  // horizontal grid lines
  const themeP=getTheme();
  ctx.strokeStyle=themeP.grid; ctx.lineWidth=1;
  [0.25,0.5,0.75,1].forEach(r=>{
    const y=chartTop+chartH*(1-r);
    ctx.beginPath(); ctx.moveTo(startX,y); ctx.lineTo(startX+totalW,y); ctx.stroke();
  });

  keys.forEach((k,i)=>{
    const v=vals[i];
    const prev=i>0?vals[i-1]:null;
    const isUp=prev===null||v>=prev;
    const barH=Math.max(4,((v-minV)/(maxV-minV||1))*chartH*0.85+chartH*0.15);
    const x=startX+i*(barW+6);
    const y=chartTop+chartH-barH;

    // bar
    const radius=4;
    ctx.beginPath();
    ctx.moveTo(x+radius,y);
    ctx.lineTo(x+barW-radius,y);
    ctx.quadraticCurveTo(x+barW,y,x+barW,y+radius);
    ctx.lineTo(x+barW,y+barH);
    ctx.lineTo(x,y+barH);
    ctx.lineTo(x,y+radius);
    ctx.quadraticCurveTo(x,y,x+radius,y);
    ctx.closePath();
    ctx.fillStyle=isUp?barUp:barDn;
    ctx.fill();

    // growth indicator dot on top
    if(prev!==null){
      const pct=(v-prev)/prev*100;
      ctx.font=`bold 8px -apple-system,sans-serif`;
      ctx.fillStyle=isUp?pctUp:'#ff3b30';
      ctx.textAlign='center';
      ctx.fillText((isUp?'+':'')+fmtD(pct,1)+'%', x+barW/2, y-3);
    }

    // label
    let label=k;
    if(mode==='month'){
      const parts=k.split('-'); // ['2025','05']
      label=parts[0].slice(2)+'/'+parts[1]; // '25/05'
    }
    const theme2=getTheme();
    ctx.font='9px -apple-system,sans-serif';
    ctx.fillStyle=theme2.text3;
    ctx.textAlign='center';
    ctx.fillText(label, x+barW/2, chartTop+chartH+13);

    // value under label
    const vText='$'+fmtInt(v/10000)+'萬';
    ctx.font='8px -apple-system,sans-serif';
    ctx.fillStyle=theme2.text2;
    ctx.fillText(vText, x+barW/2, chartTop+chartH+24);
  });

  // ── Touch interaction for period bars ──
  _periodMeta={W,H,keys,vals,barW,startX,chartH,chartTop,minV,maxV};
  if(!pcanvas._periodInteractionReady){
    pcanvas._periodInteractionReady=true;
    function _periodHit(clientX){
      if(!_periodMeta) return;
      const rect=pcanvas.getBoundingClientRect();
      const xInCanvas=(clientX-rect.left)/rect.width*_periodMeta.W;
      const {startX:sx2,barW:bw2,keys:ks}=_periodMeta;
      const i=Math.floor((xInCanvas-sx2)/(bw2+6));
      _periodTouchIdx=(i>=0&&i<ks.length)?i:-1;
      renderPeriodTrend(trendView==='year'?'year':'month');
    }
    pcanvas.addEventListener('click',e=>_periodHit(e.clientX));
    pcanvas.addEventListener('touchstart',e=>{e.preventDefault();_periodHit(e.touches[0].clientX);},{passive:false});
  }
  // Draw tooltip for selected bar
  if(_periodTouchIdx>=0 && _periodTouchIdx<keys.length){
    const i=_periodTouchIdx;
    const v2=vals[i], prev2=i>0?vals[i-1]:null;
    const barH2=Math.max(4,((v2-minV)/(maxV-minV||1))*chartH*0.85+chartH*0.15);
    const bx2=startX+i*(barW+6);
    const by2=chartTop+chartH-barH2;
    const isUp2=prev2===null||v2>=prev2;
    // Brighten selected bar
    const rr2=4;
    ctx.beginPath();
    ctx.moveTo(bx2+rr2,by2); ctx.lineTo(bx2+barW-rr2,by2);
    ctx.quadraticCurveTo(bx2+barW,by2,bx2+barW,by2+rr2);
    ctx.lineTo(bx2+barW,by2+barH2); ctx.lineTo(bx2,by2+barH2);
    ctx.lineTo(bx2,by2+rr2); ctx.quadraticCurveTo(bx2,by2,bx2+rr2,by2);
    ctx.closePath();
    ctx.fillStyle=isUp2?pctUp:'rgba(255,59,48,0.95)'; ctx.fill();
    // Tooltip box
    const theme3=getTheme();
    let lbl2=keys[i];
    if(mode==='month'){const pts=keys[i].split('-');lbl2=pts[0]+'/'+pts[1].replace(/^0/,'');}
    const diffV=prev2!==null?v2-prev2:null;
    const diffP=prev2?diffV/prev2*100:null;
    const TW2=120, TH2=diffV!==null?54:38;
    let ttx2=bx2+barW/2-TW2/2;
    if(ttx2<0) ttx2=0; if(ttx2+TW2>W) ttx2=W-TW2;
    const tty2=by2-TH2-10<chartTop?by2+barH2+6:by2-TH2-10;
    const r3=7;
    ctx.beginPath();
    ctx.moveTo(ttx2+r3,tty2); ctx.lineTo(ttx2+TW2-r3,tty2);
    ctx.quadraticCurveTo(ttx2+TW2,tty2,ttx2+TW2,tty2+r3);
    ctx.lineTo(ttx2+TW2,tty2+TH2-r3);
    ctx.quadraticCurveTo(ttx2+TW2,tty2+TH2,ttx2+TW2-r3,tty2+TH2);
    ctx.lineTo(ttx2+r3,tty2+TH2);
    ctx.quadraticCurveTo(ttx2,tty2+TH2,ttx2,tty2+TH2-r3);
    ctx.lineTo(ttx2,tty2+r3);
    ctx.quadraticCurveTo(ttx2,tty2,ttx2+r3,tty2);
    ctx.closePath();
    ctx.fillStyle=theme3.tooltipBg; ctx.fill();
    ctx.strokeStyle=theme3.tooltipBorder; ctx.lineWidth=1; ctx.stroke();
    ctx.textAlign='center';
    ctx.font='10px -apple-system,sans-serif'; ctx.fillStyle=theme3.text2;
    ctx.fillText(lbl2, ttx2+TW2/2, tty2+14);
    ctx.font='bold 11px -apple-system,sans-serif'; ctx.fillStyle=theme3.text;
    ctx.fillText('NT$ '+fmtInt(v2), ttx2+TW2/2, tty2+28);
    if(diffV!==null){
      ctx.font='10px -apple-system,sans-serif';
      ctx.fillStyle=isUp2?pctUp:'#ff3b30';
      ctx.fillText((isUp2?'+':'')+fmtInt(diffV)+' ('+(isUp2?'+':'')+fmtD(diffP,1)+'%)', ttx2+TW2/2, tty2+43);
    }
  }

  const dataLabel = trendData==='stock'?'股票' : trendData==='bank'?'存款' : '總資產';
  const first=vals[0], last=vals[vals.length-1];
  const diff=last-first, pct=diff/first*100, isUp=diff>=0;
  const col=isUp?'var(--green)':'var(--red)';
  const summaryEl=document.getElementById('period-summary');
  summaryEl.innerHTML=`
    <div style="flex:1;text-align:center">
      <div style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">${mode==='month'?'記錄月數':'記錄年數'}</div>
      <div style="font-size:20px;font-weight:700;color:var(--text)">${keys.length}</div>
    </div>
    <div style="flex:1;text-align:center;border-left:1px solid var(--border)">
      <div style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">${dataLabel}成長</div>
      <div style="font-size:20px;font-weight:700;color:${col}">${isUp?'+':''}${fmtInt(diff)}</div>
    </div>
    <div style="flex:1;text-align:center;border-left:1px solid var(--border)">
      <div style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">成長率</div>
      <div style="font-size:20px;font-weight:700;color:${col}">${isUp?'+':''}${fmtD(pct,1)}%</div>
    </div>`;

  // ── Period table ──
  const theadRow=document.getElementById('period-thead');
  const tbody=document.getElementById('period-tbody');
  const colName=mode==='month'?'月份':'年度';
  theadRow.innerHTML=`<th>${colName}</th><th>${dataLabel}</th><th>變動</th><th>成長率</th>`;
  tbody.innerHTML=keys.slice().reverse().map((k,ri)=>{
    const idx=keys.length-1-ri;
    const v=vals[idx];
    const prev=idx>0?vals[idx-1]:null;
    const d=prev!==null?v-prev:null;
    const p=prev!==null?d/prev*100:null;
    const up=d===null||d>=0;
    const dc=up?'var(--green)':'var(--red)';
    let label=k;
    if(mode==='month'){const pts=k.split('-');label=pts[0]+'/'+pts[1].replace(/^0/,'');}
    return `<tr>
      <td>${label}</td>
      <td>${fmtInt(v)}</td>
      <td style="color:${d!==null?dc:'var(--text3)'}">${d!==null?(up?'+':'')+fmtInt(d):'—'}</td>
      <td style="color:${p!==null?dc:'var(--text3)'}">${p!==null?(up?'+':'')+fmtD(p,1)+'%':'—'}</td>
    </tr>`;
  }).join('');
}

function renderAllocChart(){
  const isDarkMode = document.body.classList.contains('dark');
  const empty=document.getElementById('ch-alloc-empty');
  const content=document.getElementById('ch-alloc-content');
  const svg=document.getElementById('ch-alloc-svg');
  const barsEl=document.getElementById('ch-alloc-bars');
  if(!svg) return;
  const totalStock=stocks.reduce((a,s)=>{const v=stockMVTWD(s);return a+(v||0);},0);
  const totalBank=banks.reduce((a,b)=>a+bankTWD(b),0);
  const grand=totalStock+totalBank;
  if(grand<=0){ empty.style.display='block'; content.style.display='none'; return; }
  empty.style.display='none'; content.style.display='block';
  const COLORS=['#3478f6','#e07070','#ff9f0a','#34c759','#af52de','#5ac8fa','#ff6b6b','#30b0c7'];
  const symMap={};
  stocks.forEach(s=>{ const v=stockMVTWD(s)||0; if(v>0){ symMap[s.sym]=(symMap[s.sym]||0)+v; } });
  const segs=Object.entries(symMap).map(([sym,val],i)=>({label:sym,value:val,color:COLORS[i%COLORS.length]}));
  if(totalBank>0) segs.push({label:'存款',value:totalBank,color:'#aeaeb2'});
  segs.sort((a,b)=>b.value-a.value);
  const cx=80,cy=80,R=62,r=42; let html='', angle=-Math.PI/2;
  segs.forEach(seg=>{
    const a=seg.value/grand*Math.PI*2, end=angle+a;
    const x1=cx+R*Math.cos(angle),y1=cy+R*Math.sin(angle);
    const x2=cx+R*Math.cos(end),y2=cy+R*Math.sin(end);
    const ix1=cx+r*Math.cos(angle),iy1=cy+r*Math.sin(angle);
    const ix2=cx+r*Math.cos(end),iy2=cy+r*Math.sin(end);
    const lg=a>Math.PI?1:0;
    const strokeCol=isDarkMode?'#2a2a2a':'#ffffff';
    html+=`<path d="M${x1},${y1} A${R},${R} 0 ${lg},1 ${x2},${y2} L${ix2},${iy2} A${r},${r} 0 ${lg},0 ${ix1},${iy1} Z" fill="${seg.color}" stroke="${strokeCol}" stroke-width="2"/>`;
    angle=end;
  });
  const centerLabel=isDarkMode?'#9a9a9f':'#aeaeb2';
  const centerVal=isDarkMode?'#f0f0f0':'#1c1c1e';
  html+=`<text x="${cx}" y="${cy-5}" text-anchor="middle" font-size="9" fill="${centerLabel}" font-family="-apple-system,sans-serif">總資產</text>`;
  html+=`<text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="12" font-weight="700" fill="${centerVal}" font-family="-apple-system,sans-serif">${fmtInt(grand/10000)}萬</text>`;
  const lx=170;
  const legendName=isDarkMode?'#f0f0f0':'#1c1c1e';
  const legendPct=isDarkMode?'#9a9a9f':'#6e6e73';
  segs.slice(0,6).forEach((seg,i)=>{
    const y=14+i*24;
    html+=`<rect x="${lx}" y="${y-7}" width="8" height="8" rx="2" fill="${seg.color}"/>`;
    html+=`<text x="${lx+13}" y="${y+1}" font-size="11" fill="${legendName}" font-family="-apple-system,sans-serif" font-weight="600">${seg.label}</text>`;
    html+=`<text x="278" y="${y+1}" text-anchor="end" font-size="11" fill="${legendPct}" font-family="-apple-system,sans-serif">${(seg.value/grand*100).toFixed(1)}%</text>`;
  });
  svg.innerHTML=html;
  barsEl.innerHTML=segs.map(seg=>{
    const pct=seg.value/grand*100;
    return `<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;margin-bottom:5px">
        <span style="font-size:12px;font-weight:600;color:var(--text)">${seg.label}</span>
        <span style="font-size:12px;color:var(--text2)">NT$ ${fmtInt(seg.value)} <span style="font-weight:700;color:var(--text)">${pct.toFixed(1)}%</span></span>
      </div>
      <div style="background:var(--bg3);border-radius:6px;height:6px;overflow:hidden">
        <div style="width:${pct}%;height:100%;background:${seg.color};border-radius:6px"></div>
      </div>
    </div>`;
  }).join('');
}
/* ── Confirm Modal ── */
let _confirmCb = null;
function openConfirmModal(title, msg, onConfirm, okLabel='確認', danger=true){
  document.getElementById('confirm-modal-title').textContent = title;
  document.getElementById('confirm-modal-msg').textContent   = msg;
  const ok = document.getElementById('confirm-modal-ok');
  ok.textContent = okLabel;
  ok.style.background = danger ? 'var(--red)' : 'var(--accent)';
  _confirmCb = onConfirm;
  document.getElementById('confirm-modal').style.display = 'flex';
}
function closeConfirmModal(){
  document.getElementById('confirm-modal').style.display = 'none';
  _confirmCb = null;
}
function doConfirm(){
  const cb = _confirmCb;
  closeConfirmModal();
  if(cb) cb();
}

/* ── Prevent iOS auto-zoom on input focus ── */
(()=>{
  const meta = document.querySelector('meta[name="viewport"]');
  const ori  = meta.content;
  const lock = ori.includes('maximum-scale') ? ori : ori + ', maximum-scale=1.0';
  document.addEventListener('focusin',  e=>{ if(e.target.matches('input,select,textarea')) meta.content=lock; });
  document.addEventListener('focusout', e=>{ if(e.target.matches('input,select,textarea')) meta.content=ori;  });
})();

/* ── Service Worker ── */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
